      },
      "en": {
        "title": "Add remaining flour and refrigerate overnight",

      },

        "title": "Work the dough",
        "text": "Remove the dough from the refrigerator and allow it to come to room temperature. Knead in the vegetable shortening, butter, salt, sugar, and eggs one at a time. Slap and fold the dough onto the work surface about 100 times (or knead in a stand mixer for about 10 minutes) until it is smooth, elastic, and no longer sticks to your hands."
      },
      "es": {
        "title": "Trabajar la masa",
        "text": "Sacar la masa de la nevera y dejar que alcance la temperatura ambiente. Amasar incorporando la manteca vegetal, la mantequilla, la sal, el azúcar y los huevos de uno en uno. Golpear y plegar la masa sobre la superficie de trabajo unas 100 veces (o amasar en robot de cocina unos 10 minutos) hasta que esté lisa, elástica y no se pegue a las manos."

      },
      "en": {
        "title": "Fill and roll",
        "text": "Divide the dough into 3 equal parts. Roll each piece out on a floured surface to a rectangle about ½–1 cm thick. Distribute the ham, raisins, and chopped olives evenly over it, leaving a 2–3 cm border. Roll up tightly like a Swiss roll and seal the ends well."
      },
      "es": {

        "text": "Dividir la masa en 3 partes iguales. Extender cada parte sobre una superficie enharinada hasta obtener un rectángulo de unos ½–1 cm de grosor. Distribuir el jamón, las pasas y las aceitunas picadas de manera uniforme, dejando un borde de 2–3 cm. Enrollar firmemente como un brazo de gitano y cerrar bien los extremos."
      }
    },

      },
      "en": {
        "title": "Second rise",
        "text": "Place the dough rolls diagonally on buttered baking sheets. Cover with a damp cloth and leave to rise for about 2 hours until they have risen significantly."
      },
      "es": {
        "title": "Segundo levado",
        "text": "Colocar los rollos de masa en diagonal sobre las bandejas de horno enmantequilladas. Cubrir con un paño húmedo y dejar levar unas 2 horas hasta que hayan aumentado considerablemente de tamaño."
      }
    },

        "text": "Ofen auf 200 °C (Ober-/Unterhitze) bzw. 180 °C Umluft vorheizen. Jeden Laib zuerst 20 Minuten backen. Dann mit einer Mischung aus Eigelb, 2 EL Wasser und einer Prise Salz bestreichen und weitere 10 Minuten goldbraun fertigbacken. Die Laibe nacheinander backen und frisch aus dem Ofen am besten genießen."
      },

        "title": "Bake and glaze",
        "text": "Preheat the oven to 200 °C (top/bottom heat) or 180 °C fan. Bake each loaf for 20 minutes first. Then brush with a mixture of egg yolk, 2 tbsp water, and a pinch of salt, and bake for a further 10 minutes until golden brown. Bake the loaves one at a time and enjoy them best fresh from the oven."

        "title": "Hornear y glasear",
        "text": "Precalentar el horno a 200 °C (calor arriba y abajo) o 180 °C con ventilador. Hornear cada pan durante 20 minutos primero. Luego pincelar con una mezcla de yema de huevo, 2 cucharadas de agua y una pizca de sal, y hornear otros 10 minutos hasta que estén dorados. Hornear los panes de uno en uno y disfrutarlos preferiblemente recién salidos del horno."
      }

<!-- ═══════════════════════════════════════════════════════════════════
     DESIGN / STYLES
     Edit this section freely — the recipe data above is untouched.
     ═══════════════════════════════════════════════════════════════════ -->
<style>
  :root {
    --bg:           #faf8f5;
    --surface:      #ffffff;
    --surface2:     #f4f1ec;
    --accent:       #8b6f47;
    --accent-light: #c9a96e;
    --text:         #2c2416;
    --text-muted:   #7a6a55;
    --border:       #e8e0d4;
    --tag-bg:       #ede9e1;
    --radius:       12px;
    --shadow:       0 2px 12px rgba(44,36,22,0.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }

  /* ── Language bar ── */
  .lang-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: flex-end;
    padding: 0.55rem 1.5rem; gap: 0.5rem;
  }
  .lang-btn {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 0.28rem 0.95rem;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.07em;
    cursor: pointer; color: var(--text-muted);
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .lang-btn.active, .lang-btn:hover {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  /* ── Hero ── */
  .hero img {
    width: 100%; display: block;
    height: clamp(200px, 42vw, 460px);
    object-fit: cover;
  }

  /* ── Recipe header (title below image) ── */
  .recipe-header {
    background: var(--surface);
    padding: 1.4rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .recipe-header h1 {
    font-size: clamp(1.25rem, 2.8vw, 1.9rem);
    font-weight: 700; color: var(--text);
    line-height: 1.25; margin-bottom: 0.25rem;
  }
  .recipe-header .subtitle {
    font-size: 0.95rem; color: var(--text-muted); font-style: italic;
  }

  /* ── Meta bar ── */
  .meta-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap;
    gap: 0.4rem 0.9rem;
    padding: 0.7rem 1.5rem;
  }
  .meta-tag {
    background: var(--tag-bg); border-radius: 20px;
    padding: 0.28rem 0.85rem;
    font-size: 0.8rem; color: var(--text-muted);
    display: flex; align-items: center; gap: 0.38rem;
  }
  .meta-tag svg { flex-shrink: 0; }

  /* ── Main container ── */
  .container {
    max-width: 900px; margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* ── Section headers ── */
  h2 {
    font-size: 1.15rem; font-weight: 700;
    color: var(--accent);
    margin-bottom: 1rem; padding-bottom: 0.35rem;
    border-bottom: 2px solid var(--border);
    letter-spacing: 0.02em;
  }

  /* ── Servings selector ── */
  .servings-row {
    display: flex; align-items: center;
    gap: 0.75rem; margin-bottom: 1.5rem;
  }
  .servings-row label {
    font-size: 0.88rem; color: var(--text-muted);
  }
  .serving-btn {
    background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 0.35rem 0.85rem;
    font-size: 0.88rem; color: var(--text-muted);
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .serving-btn.active, .serving-btn:hover {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  /* ── Ingredients list ── */
  .ingredients-list {
    margin-bottom: 2rem;
    border-top: 1px solid var(--border);
  }
  .ingredient-row {
    display: flex; align-items: baseline; gap: 1rem;
    padding: 0.6rem 0.25rem;
    border-bottom: 1px solid var(--border);
  }
  .ing-amount {
    font-weight: 700; color: var(--text);
    min-width: 64px; font-size: 0.88rem; flex-shrink: 0;
    text-align: right;
  }
  .ing-name { color: var(--text); font-size: 0.88rem; }
  .pantry-note {
    font-size: 0.8rem; color: var(--text-muted); font-style: italic;
    padding: 0.55rem 0.25rem;
    border-bottom: 1px solid var(--border);
  }


  /* ── Equipment ── */
  .equipment {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.85rem 1.1rem; margin-bottom: 2rem;
    font-size: 0.88rem; color: var(--text-muted);
    display: flex; flex-wrap: wrap; gap: 0.3rem 0;
  }
  .equip-item + .equip-item::before { content: " · "; margin: 0 0.4rem; }

  /* ── Steps ── */
  .steps { margin-bottom: 2rem; }
  .step {
    display: grid;
    grid-template-columns: 2.6rem 1fr;
    gap: 0.85rem; margin-bottom: 1.8rem;
    align-items: start;
  }
  .step-num {
    width: 2.2rem; height: 2.2rem;
    background: var(--accent); color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem;
    flex-shrink: 0; margin-top: 0.15rem;
  }
  .step-content h3 {
    font-size: 0.97rem; font-weight: 700;
    margin-bottom: 0.3rem; color: var(--text);
  }
  .step-content p {
    font-size: 0.9rem; color: var(--text-muted); line-height: 1.65;
    margin-bottom: 0.7rem;
  }
  .step-img {
    width: 100%; max-width: 380px; height: auto;
    border-radius: 10px; box-shadow: var(--shadow); display: block;
  }

  /* ── Nutrition table ── */
  .nutrition-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    font-size: 0.86rem; margin-bottom: 2rem;
  }
  .nutrition-table table { width: 100%; border-collapse: collapse; }
  .nutrition-table th {
    background: var(--surface2);
    padding: 0.6rem 0.9rem; text-align: left;
    color: var(--text-muted); font-weight: 600;
    font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .nutrition-table td { padding: 0.55rem 0.9rem; border-top: 1px solid var(--border); }
  .nutrition-table td:last-child { text-align: right; color: var(--text-muted); }
  .nutrition-table tr.sub td:first-child {
    padding-left: 1.8rem; color: var(--text-muted); font-size: 0.82rem;
  }

  /* ── Footer ── */
  footer {
    text-align: center; padding: 1.5rem;
    font-size: 0.75rem; color: var(--text-muted);
    border-top: 1px solid var(--border);
  }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .recipe-header { padding: 1.1rem 1rem 0.85rem; }
    .meta-bar      { padding: 0.6rem 1rem; }
    .lang-bar      { padding: 0.5rem 1rem; }
    .container     { padding: 1.4rem 1rem; }
    .step          { grid-template-columns: 2.2rem 1fr; gap: 0.65rem; }
    .step-img      { max-width: 100%; }
    .nutrition-table th,
    .nutrition-table td { padding: 0.45rem 0.6rem; font-size: 0.78rem; }
  }

/* ── Source block ──────────────────────────────────────── */
.source-block {
  margin-top: 2.5rem;
  padding: 1rem 1.25rem;
  border-left: 4px solid var(--accent);
  background: var(--card-bg);
  border-radius: 0 8px 8px 0;
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.source-block strong {
  display: block;
  font-size: 0.75rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: .35rem;
}
.source-block a {
  color: var(--text);
  text-decoration: underline;
  text-underline-offset: 3px;
  word-break: break-all;
}
.source-block a:hover { color: var(--accent); }
</style>
</head>

        steps: "Preparación", nutrition: "Información nutricional", pantryLabel: "De despensa",
        time: (a,b) => `${a}–${b} minutos`, perServing: s => `por ración (aprox. ${s} g)`,
        per100: "por 100 g", footer: src => `Receta: ${src}`, source: "Fuente" }
};

const NUTRITION_LABELS = {
  de: { energy:"Brennwert", fat:"Fett", sat_fat:"davon ges. Fettsäuren",
        carbs:"Kohlenhydrate", sugars:"davon Zucker", protein:"Eiweiß", salt:"Salz" },
  en: { energy:"Energy", fat:"Fat", sat_fat:"of which saturates",
        carbs:"Carbohydrates", sugars:"of which sugars", protein:"Protein", salt:"Salt" },
  es: { energy:"Valor energético", fat:"Grasas", sat_fat:"de las cuales saturadas",
        carbs:"Hidratos de carbono", sugars:"de los cuales azúcares", protein:"Proteínas", salt:"Sal" }
};

// ── State ─────────────────────────────────────────────────────────────
// Honor a ?lang= query param (e.g. opened from the meal planner); default "de".
const _urlLang      = new URLSearchParams(location.search).get("lang");
let currentLang     = ["de", "en", "es"].includes(_urlLang) ? _urlLang : "de";
let currentServings = 0; // index into servings_options


// ── Helpers ───────────────────────────────────────────────────────────
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls)  e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function icon(path, title) {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" aria-label="${title}">${path}</svg>`;
}

// ── Renderers ─────────────────────────────────────────────────────────
function renderHero(R) {
  const div = el("div", "hero");
  const img = document.createElement("img");
  img.src = R.images.main;
  img.alt = R.title[currentLang];
  div.appendChild(img);
  return div;
}

function renderHeader(R) {
  const div = el("div", "recipe-header");
  div.appendChild(el("h1",      null, R.title[currentLang]));
  div.appendChild(el("div", "subtitle", R.subtitle[currentLang]));
  return div;
}

function renderMetaBar(R) {
  const ui  = UI[currentLang];
  const bar = el("div", "meta-bar");
  const timeIco = icon(
    '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    "time");
  const kcalIco = icon(
    '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
    "calories");
  bar.innerHTML = `
    <span class="meta-tag">${timeIco} ${ui.time(R.time_min, R.time_max)}</span>
    <span class="meta-tag">${kcalIco} ${R.kcal_per_serving} kcal · ${R.kj_per_serving} kJ</span>
    ${R.tags.map(t => `<span class="meta-tag">${t}</span>`).join("")}`;
  return bar;
}

function renderIngredients(R) {
  const ui   = UI[currentLang];
  const frag = document.createDocumentFragment();
  frag.appendChild(el("h2", null, ui.ingredients));
  const list = el("div", "ingredients-list");
  R.ingredients.forEach(ing => {
    const row = el("div", "ingredient-row");
    const amt = Array.isArray(ing.amounts)
      ? ing.amounts[currentServings]
      : (ing.amounts[currentLang] || ing.amounts.de)[currentServings];
    row.appendChild(el("span", "ing-amount", amt));
    row.appendChild(el("span", "ing-name",   ing[currentLang]));
    list.appendChild(row);
  });
  list.appendChild(el("div", "pantry-note",
    `${ui.pantryLabel}: ${R.pantry[currentLang]}`));
  frag.appendChild(list);
  return frag;
}

function renderEquipment(R) {
  const ui  = UI[currentLang];
  const frag = document.createDocumentFragment();
  frag.appendChild(el("h2", null, ui.equipment));
  const box  = el("div", "equipment");
  R.equipment[currentLang].forEach(item => {
    box.appendChild(el("span", "equip-item", item));
  });
  frag.appendChild(box);
  return frag;
}

function renderSteps(R) {
  const ui   = UI[currentLang];
  const frag = document.createDocumentFragment();
  frag.appendChild(el("h2", null, ui.steps));
  const wrap = el("div", "steps");
  R.steps.forEach((step, i) => {
    const s    = step[currentLang];
    const div  = el("div", "step");
    div.appendChild(el("div", "step-num", String(i + 1)));
    const content = el("div", "step-content");
    content.appendChild(el("h3", null, s.title));
    content.appendChild(el("p",  null, s.text));
    if (step.image && R.images[step.image]) {
      const img = document.createElement("img");
      img.className = "step-img";
      img.src = R.images[step.image];
      img.alt = s.title;
      content.appendChild(img);
    }
    div.appendChild(content);
    wrap.appendChild(div);
  });
  frag.appendChild(wrap);
  return frag;
}

function renderNutrition(R) {
  const ui  = UI[currentLang];
  const lbl = NUTRITION_LABELS[currentLang];
  const n0  = R.nutrition.per_100g;
  const ns  = R.nutrition.per_serving;
  const frag = document.createDocumentFragment();
  frag.appendChild(el("h2", null,
    `${ui.nutrition} <small style="font-weight:400;font-size:0.8rem;color:var(--text-muted)">
    (${ui.perServing(R.serving_weight_g)})</small>`));
  const rows = [
    ["energy",  `${n0.energy_kj} kJ / ${n0.energy_kcal} kcal`, `${ns.energy_kj} kJ / ${ns.energy_kcal} kcal`, false],
    ["fat",     `${n0.fat_g} g`,     `${ns.fat_g} g`,     false],
    ["sat_fat", `${n0.sat_fat_g} g`, `${ns.sat_fat_g} g`, true],
    ["carbs",   `${n0.carbs_g} g`,   `${ns.carbs_g} g`,   false],
    ["sugars",  `${n0.sugars_g} g`,  `${ns.sugars_g} g`,  true],
    ["protein", `${n0.protein_g} g`, `${ns.protein_g} g`, false],
    ["salt",    `${n0.salt_g} g`,    `${ns.salt_g} g`,    false],
  ];
  const tbl = el("div", "nutrition-table");
  tbl.innerHTML = `<table>
    <tr><th></th><th>${ui.per100}</th><th>${ui.perServing(R.serving_weight_g)}</th></tr>
    ${rows.map(([key, v100, vsrv, sub]) =>
      `<tr${sub ? ' class="sub"' : ""}><td>${lbl[key]}</td><td>${v100}</td><td>${vsrv}</td></tr>`
    ).join("")}
  </table>`;
  frag.appendChild(tbl);
  return frag;
}

function renderServingsRow(R) {
  const ui  = UI[currentLang];
  const row = el("div", "servings-row");
  row.appendChild(el("label", null, `${ui.servings}:`));
  R.servings_options.forEach((n, i) => {
    const btn = el("button", "serving-btn" + (i === currentServings ? " active" : ""), String(n));
    btn.addEventListener("click", () => { currentServings = i; render(); });
    row.appendChild(btn);
  });
  return row;
}


function renderSource(R) {
  if (!R.source_url) return null;
  const block = el("div", "source-block");
  const label = el("strong", null, UI[currentLang].source);
  const a = document.createElement("a");
  a.href = R.source_url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = R.source;
  block.appendChild(label);
  block.appendChild(a);
  return block;
}

// ── Main render ───────────────────────────────────────────────────────
function render() {
  const R = window.RECIPE;
  document.documentElement.lang = currentLang;

  // Static zones (only need re-render on lang change, not servings)
  document.getElementById("zone-hero").replaceChildren(renderHero(R));
  document.getElementById("zone-header").replaceChildren(renderHeader(R));
  document.getElementById("zone-meta").replaceChildren(renderMetaBar(R));
  document.getElementById("zone-footer").textContent = UI[currentLang].footer(R.source);

  // Dynamic zone (re-renders on both lang and servings change)
  const main = document.getElementById("zone-main");
  main.replaceChildren(
    renderServingsRow(R),
    renderIngredients(R),
    renderEquipment(R),
    renderSteps(R),
    renderNutrition(R),
    ...(renderSource(R) ? [renderSource(R)] : [])
  );

  // Sync lang buttons
  document.querySelectorAll(".lang-btn").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.lang === currentLang));
}

function setLang(lang) { currentLang = lang; render(); }

// ── Boot ─────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  window.RECIPE = JSON.parse(document.getElementById("recipe-data").textContent);
  render();
});
</script>

<!-- ── Shell (no content here — the renderer fills these zones) ── -->
<div class="lang-bar">
  <button class="lang-btn active" data-lang="de" onclick="setLang('de')">DE</button>
  <button class="lang-btn"        data-lang="en" onclick="setLang('en')">EN</button>
  <button class="lang-btn"        data-lang="es" onclick="setLang('es')">ES</button>
</div>
<div id="zone-hero"></div>
<div id="zone-header"></div>
<div id="zone-meta"></div>
<div class="container">
  <div id="zone-main"></div>
</div>
<footer><span id="zone-footer"></span></footer>

</body>
</html>
